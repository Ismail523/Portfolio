<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="timer-container">
        <h2>Countdown Timer</h2>
        <p>Set your Time Below</p>
        
        <!-- Input Fields -->
        <div class="input-group" id="inputs-container">
            <input type="number" id="hrs-input" placeholder="Hour" min="0" max="99">
            <span>:</span>
            <input type="number" id="mins-input" placeholder="Min" min="0" max="59">
            <span>:</span>
            <input type="number" id="secs-input" placeholder="Sec" min="0" max="59">
        </div>

        <!-- Display Area -->
        <div class="timer-display" id="display">00:00:00</div>

        <!-- Control Buttons -->
        <div class="controls">
            <button id="start-btn" class="btn start">Start</button>
            <button id="pause-btn" class="btn pause" disabled>Pause</button>
            <button id="reset-btn" class="btn reset">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
