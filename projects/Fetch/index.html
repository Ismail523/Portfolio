<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
}

/* Fetch Users Button */
#fetchBtn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s ease;
    margin-bottom: 25px;
}

#fetchBtn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25);
}

#fetchBtn:active {
    transform: translateY(0);
}

/* User List Container */
#userList {
    width: 100%;
    max-width: 500px;
    background: white;
    padding: 25px 25px 25px 55px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

/* Individual User */
#userList li {
    padding: 12px 10px;
    margin-bottom: 8px;
    background: #f8fafc;
    border-radius: 6px;
    color: #334155;
    font-size: 16px;
    transition: 0.2s ease;
}

#userList li:hover {
    background: #dbeafe;
    color: #1d4ed8;
    padding-left: 16px;
}

/* Responsive Design */
@media (max-width: 600px) {
    body {
        padding: 35px 15px;
    }

    #fetchBtn {
        width: 100%;
        max-width: 300px;
    }

    #userList {
        padding: 20px 15px 20px 40px;
    }

    #userList li {
        font-size: 14px;
    }
}
    </style>
</head>
<body>
    <button id="fetchBtn">Fetch</button>
<ol id="userList"></ol>
<script>
    document.getElementById("fetchBtn").addEventListener("click", async () => {
    const list = document.getElementById("userList");
    list.textContent = "Loading...";

    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/users"
        );

        if (!response.ok) {
            throw new Error("Failed to fetch users");
        }

        const users = await response.json();
        list.replaceChildren();

        users.forEach(user => {
            const item = document.createElement("li");
        
            item.textContent = user.name;
        
            list.appendChild(item);
       
            
        });
    } catch (error) {
        list.textContent = "Unable to load users. Please try again.";
    }
});
</script>
</body>
</html>
